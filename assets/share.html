<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* adeck's own palette (Rune's opencode theme), so a shared page looks like the app. */
:root {
  --deep: #080808; --bg: #121212; --l1: #242424; --l2: #2e2e2e; --l3: #3a3a3a; --l4: #5c5c5c;
  --bd-muted: #ffffff14; --bd: #ffffff1a; --bd-strong: #ffffff33;
  --text: #fafafa; --muted: #aeaeae; --faint: #808080; --accent: #a2bcff; --blue: #4565f6;
  --tile-on: #33363e; --good: #55ab67; --good-bg: #244b22; --warn: #c9ad66; --warn-bg: #c9ad6629;
  --well: #0e0f12; --wave: #3f6fb5; --wave-core: #8c9bb0; --wave-on: #60a8ff; --wave-on-core: #c8e1ff;
  --hover: #ffffff0f; --shadow: 0 18px 48px rgba(0,0,0,.45); --scrim: rgba(0,0,0,.4);
}
:root[data-theme="light"] {
  --deep: #fafafa; --bg: #f8f8f8; --l1: #ffffff; --l2: #f2f2f2; --l3: #eeeeee; --l4: #dbdbdb;
  --bd-muted: #00000014; --bd: #0000001a; --bd-strong: #00000033;
  --text: #161616; --muted: #5c5c5c; --faint: #808080; --accent: #3b5cf6;
  --tile-on: #e3e7fa; --good: #2f8a4c; --good-bg: #d2e2d1; --warn: #94741f; --warn-bg: #e9dcb4;
  --hover: #0000000a; --shadow: 0 18px 48px rgba(20,30,50,.16); --scrim: rgba(0,0,0,.25);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --deep: #fafafa; --bg: #f8f8f8; --l1: #ffffff; --l2: #f2f2f2; --l3: #eeeeee; --l4: #dbdbdb;
    --bd-muted: #00000014; --bd: #0000001a; --bd-strong: #00000033;
    --text: #161616; --muted: #5c5c5c; --faint: #808080; --accent: #3b5cf6;
    --tile-on: #e3e7fa; --good: #2f8a4c; --good-bg: #d2e2d1; --warn: #94741f; --warn-bg: #e9dcb4;
    --hover: #0000000a; --shadow: 0 18px 48px rgba(20,30,50,.16); --scrim: rgba(0,0,0,.25);
  }
}
* { box-sizing: border-box; }
html { scroll-padding-top: 150px; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; padding-bottom: 32px; }
button { font: inherit; color: inherit; }
.tnum { font-variant-numeric: tabular-nums; }
svg { flex: none; }

/* Controls, as rune-kit draws them */
.btn { appearance: none; height: 24px; padding: 0 9px; border: 1px solid var(--bd); border-radius: 5px; background: var(--l2); color: var(--text); font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background .12s; }
.btn:hover { background: var(--l3); }
.ib { width: 28px; height: 28px; padding: 0; display: inline-grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; }
.ib:hover { background: var(--hover); color: var(--text); }
.ib svg { width: 15px; height: 15px; }
.kc { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border: 1px solid var(--bd); border-radius: 5px; background: var(--l2); color: var(--muted); font-size: 11.5px; font-weight: 500; }
.switch { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; cursor: pointer; user-select: none; border: 0; background: none; padding: 0; }
.switch i { position: relative; width: 36px; height: 20px; border-radius: 10px; background: var(--l3); transition: background .15s; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .18s cubic-bezier(.3,.7,.3,1); }
.switch.on i { background: var(--blue); }
.switch.on i::after { transform: translateX(16px); }
.field { display: flex; align-items: center; gap: 7px; height: 30px; width: 260px; padding: 0 9px; border: 1px solid var(--bd); border-radius: 6px; background: var(--l1); color: var(--faint); }
.field[hidden] { display: none; }
.field:focus-within { border-color: #7698fd; }
.field input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 13px; }
.field input::placeholder { color: var(--faint); }
.field .x { display: none; cursor: pointer; color: var(--faint); background: none; border: 0; padding: 0; }
.field.has .x { display: inline-grid; }

/* Window: titlebar, toolbar, transport, status bar */
.titlebar { position: sticky; top: 0; z-index: 30; height: 44px; display: flex; align-items: center; gap: 4px; padding: 0 12px 0 16px; background: var(--deep); }
.tab { display: flex; align-items: center; gap: 8px; height: 28px; max-width: 320px; min-width: 0; padding: 0 12px 0 10px; border-radius: 7px; background: var(--l1); font-weight: 600; font-size: 13px; }
.tab svg { width: 14px; height: 14px; color: var(--muted); }
.tab span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.titlebar .sp { flex: 1; }
.chrome { position: sticky; top: 44px; z-index: 20; background: var(--bg); padding: 10px 16px 8px; }
.toolbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; min-height: 30px; }
.toolbar .sp { flex: 1; }
.count { color: var(--muted); }
.count:empty { display: none; }
.tally { display: flex; gap: 10px; align-items: center; }
.tally span { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; }
.tally b { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 4px; font-size: 11.5px; font-weight: 600; }
.tally .good b { background: var(--good-bg); color: var(--good); } .tally .close b { background: var(--l3); color: var(--text); } .tally .bad b { background: var(--warn-bg); color: var(--warn); }
.transport { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
.play { width: 26px; height: 26px; padding: 0; display: grid; place-items: center; border: 1px solid var(--bd); border-radius: 5px; background: var(--l3); color: var(--text); cursor: pointer; flex: none; }
.play:hover { background: var(--l4); }
.play svg { width: 12px; height: 12px; }
.level { width: 40px; height: 4px; border-radius: 2px; background: var(--l3); overflow: hidden; flex: none; }
.level i { display: block; height: 100%; width: 0; background: var(--good); transition: width .08s; }
.clock { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.track { position: relative; flex: 1; height: 18px; cursor: pointer; touch-action: none; min-width: 60px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 8px; height: 2px; background: var(--l3); border-radius: 1px; }
.track i { position: absolute; left: 0; top: 8px; height: 2px; background: var(--text); width: 0; border-radius: 1px; }
.track b { position: absolute; top: 3px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px var(--bd-strong), 0 1px 3px rgba(0,0,0,.4); left: 0; }
.vol { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.vol svg { width: 14px; height: 14px; }
input[type=range] { width: 70px; accent-color: var(--blue); }
.status { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; height: 32px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--bg); border-top: 1px solid var(--bd-muted); color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; }
.status .sp { flex: 1; }
.status .fine { color: var(--faint); overflow: hidden; text-overflow: ellipsis; }

/* Page */
.page { padding: 4px 16px 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.page.with-sheet { grid-template-columns: minmax(0, 1fr) 420px; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; margin-bottom: 12px; border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--bd)); border-radius: 6px; background: color-mix(in srgb, var(--accent) 6%, var(--l1)); font-size: 14px; }
.note[hidden] { display: none; }
.note svg { width: 14px; height: 14px; margin-top: 3px; color: var(--accent); }
.empty { padding: 40px; text-align: center; color: var(--muted); }

/* Board: one card per group, a row of tiles */
.card { margin-bottom: 12px; padding: 10px 12px 12px; border: 1px solid var(--bd-muted); border-radius: 6px; background: var(--l1); transition: border-color .15s; }
.card.on { border-color: var(--bd-strong); }
.card.hidden { display: none; }
.chead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.chead h2 { margin: 0; font-size: 14px; font-weight: 600; }
.chead .sub { color: var(--muted); font-size: 12px; }
.chead .sp { flex: 1; }
.chip { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11.5px; font-weight: 600; white-space: nowrap; background: var(--l2); color: var(--muted); }
.chip.good { background: var(--good-bg); color: var(--good); } .chip.close { background: var(--l3); color: var(--text); } .chip.bad { background: var(--warn-bg); color: var(--warn); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.tile { appearance: none; text-align: left; display: flex; flex-direction: column; gap: 5px; padding: 7px 8px 8px; border: 1px solid var(--bd-muted); border-radius: 6px; background: var(--l1); cursor: pointer; min-width: 0; transition: background .12s, border-color .12s; }
.tile:hover { background: color-mix(in srgb, var(--text) 3%, var(--l1)); }
.tile.on { background: var(--tile-on); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.tl { display: flex; align-items: baseline; gap: 6px; font-size: 12px; font-weight: 600; min-width: 0; }
.tl .n { color: var(--faint); font-weight: 500; }
.tl .lbl { color: var(--rc, var(--text)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
canvas.wave { display: block; width: 100%; border-radius: 3px; background: var(--well); }
.tile canvas.wave { height: 44px; }
.local { display: grid; place-items: center; height: 44px; border-radius: 3px; border: 1px dashed var(--bd-strong); color: var(--faint); font-size: 11.5px; text-align: center; padding: 0 8px; }
.nums { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.dur { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.tile .chip { align-self: flex-start; }

/* The sheet: what's playing, big */
.sheet { position: sticky; top: 152px; align-self: start; max-height: calc(100vh - 196px); overflow: auto; padding: 12px; border: 1px solid var(--bd-muted); border-radius: 8px; background: var(--l1); }
.sheet[hidden] { display: none; }
.sheet h3 { margin: 0; font-size: 14px; font-weight: 600; }
.sheet .who { color: var(--muted); font-size: 12px; margin-top: 1px; }
.hearing { display: flex; align-items: center; gap: 8px; margin: 10px 0 6px; font-size: 12px; color: var(--muted); }
.hearing b { color: var(--text); font-weight: 600; }
.hearing .sp { flex: 1; }
.ruler { position: relative; height: 16px; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; margin-bottom: 4px; }
.ruler span { position: absolute; top: 0; padding-left: 3px; border-left: 1px solid var(--bd-strong); height: 15px; line-height: 15px; }
.sheet canvas.wave { height: 96px; cursor: pointer; touch-action: none; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 3px 10px; margin: 0; font-size: 12px; }
.kv dt { color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kv dd { margin: 0; color: var(--text); word-break: break-word; }
.sec { margin: 14px 0 4px; font-size: 12px; font-weight: 500; color: var(--muted); }
.sheet .close { display: none; }

/* Compare: stacked strips on one time axis */
.cmp .ruler { margin-left: 222px; }
.strip { display: grid; grid-template-columns: 210px 1fr; gap: 12px; margin-bottom: 8px; }
.strip .card2 { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--bd-muted); border-radius: 6px; background: var(--l1); cursor: pointer; min-width: 0; }
.strip.on .card2 { background: var(--tile-on); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.card2 .n { color: var(--faint); font-size: 12px; }
.card2 .t { min-width: 0; }
.card2 .nm { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card2 .nm b { margin-right: 6px; font-weight: 600; }
.strip.on .card2 .nm b { color: var(--accent); }
.card2 .nums { -webkit-line-clamp: 1; }
.strip canvas.wave { height: 62px; background: transparent; cursor: pointer; touch-action: none; }
:root[data-theme="light"] .strip canvas.wave { background: var(--well); }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .strip canvas.wave { background: var(--well); } }
.strip .local { height: 62px; }
.diff { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 12px; table-layout: fixed; }
.diff th { text-align: left; font-weight: 500; color: var(--muted); padding: 4px 8px; }
.diff th.on { color: var(--accent); }
.diff td { padding: 3px 8px; color: var(--muted); word-break: break-word; vertical-align: top; }
.diff td:first-child { color: var(--faint); }
.diff td.on { color: var(--text); font-weight: 600; }
.diff tr:nth-child(even) td { background: var(--hover); }

/* Pads */
.pads { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.pad { position: relative; overflow: hidden; appearance: none; text-align: left; min-height: 104px; padding: 9px 10px 12px; border: 1px solid var(--bd-muted); border-radius: 6px; background: var(--l2); cursor: pointer; transition: background .12s, border-color .12s, transform .08s; }
.pad:hover { background: color-mix(in srgb, var(--text) 4%, var(--l2)); }
.pad:active { transform: scale(.985); }
.pad.on { background: var(--tile-on); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.pad[disabled] { opacity: .5; cursor: default; }
.pad .ptop { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--rc, var(--muted)); }
.pad .name { margin: 10px 0 2px; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pad .fill { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--accent); }

/* Search and keys overlays, as adeck's */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: flex; justify-content: center; align-items: flex-start; padding: 90px 16px 0; opacity: 0; pointer-events: none; transition: opacity .14s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.panel { width: 640px; max-width: 100%; border: 1px solid var(--bd-strong); border-radius: 14px; background: var(--l1); box-shadow: var(--shadow); overflow: hidden; transform: translateY(-10px) scale(.98); transition: transform .18s cubic-bezier(.2,.8,.2,1); }
.scrim.open .panel { transform: none; }
.panel .q { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--bd-muted); color: var(--faint); }
.panel .q input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 15px; }
.panel .list { max-height: 420px; overflow: auto; padding: 6px; }
.panel .list .sec { margin: 0; padding: 8px 10px 4px; color: var(--faint); }
.hit { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 8px; cursor: pointer; }
.hit.on { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.hit svg { width: 16px; height: 16px; color: var(--faint); }
.hit.on svg { color: var(--text); }
.hit b { font-weight: 400; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 60%; }
.hit span { color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel .foot { display: flex; gap: 14px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--bd-muted); color: var(--faint); font-size: 12px; }
.panel .foot .sp { flex: 1; }
.panel .foot span.h { display: inline-flex; align-items: center; gap: 6px; }
.panel .none { padding: 18px 12px; color: var(--muted); }
.keys .hd { display: flex; align-items: center; gap: 6px; padding: 14px 20px; border-bottom: 1px solid var(--bd-muted); font-weight: 600; }
.keys .hd .sp { flex: 1; }
.keys .hd small { color: var(--faint); font-weight: 400; font-size: 12px; }
.keys .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 32px; padding: 18px 20px; }
.keys h4 { margin: 0 0 6px; font-size: 12px; font-weight: 500; color: var(--faint); }
.keys h4 em { font-style: normal; color: var(--accent); margin-left: 8px; }
.keys .k { display: flex; align-items: center; gap: 10px; height: 26px; }
.keys .k span:first-child { flex: 1; }
.keys .k .caps { display: flex; gap: 3px; }
.toast { position: fixed; left: 50%; bottom: 48px; transform: translate(-50%, 8px); z-index: 50; padding: 7px 12px; border: 1px solid var(--bd-strong); border-radius: 8px; background: var(--l2); color: var(--text); font-size: 12.5px; opacity: 0; transition: opacity .18s, transform .18s; pointer-events: none; box-shadow: var(--shadow); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.narrow-only { display: none !important; }

@media (max-width: 1100px) {
  .page.with-sheet { grid-template-columns: minmax(0, 1fr); }
  .sheet { position: fixed; top: auto; left: 8px; right: 8px; bottom: 40px; z-index: 35; max-height: 62vh; box-shadow: var(--shadow); border-color: var(--bd-strong); transform: translateY(calc(100% + 60px)); transition: transform .22s cubic-bezier(.2,.8,.2,1); }
  .sheet.open { transform: none; }
  .sheet .close { display: inline-grid; }
  .narrow-only:not([hidden]) { display: inline-flex !important; align-items: center; }
}
@media (max-width: 700px) {
  .titlebar { padding: 0 6px 0 10px; }
  .tab { max-width: 58vw; }
  .field { width: 100%; order: 10; }
  .vol, .level, .status .fine { display: none; }
  .chrome { padding: 8px 12px 6px; }
  .page { padding: 4px 12px 20px; }
  .tiles { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .strip { grid-template-columns: 1fr; gap: 4px; }
  .cmp .ruler { margin-left: 0; }
  .keys .grid { grid-template-columns: 1fr; }
  .diff { display: block; overflow-x: auto; }
}
</style>
</head>
<body>
<div class="titlebar">
  <div class="tab"><svg id="tabIcon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"></svg><span id="tabTitle"></span></div>
  <span class="sp"></span>
  <button class="ib" id="openPalette" title="Search · ⌘K"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14" stroke-linecap="round"/></svg></button>
  <button class="ib" id="copy" title="Copy link"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M6.5 9.5l3-3M7 4.5l1.2-1.2a2.5 2.5 0 013.5 3.5L10.5 8M9 11.5l-1.2 1.2a2.5 2.5 0 01-3.5-3.5L5.5 8"/></svg></button>
  <button class="ib" id="theme" title="Theme: auto"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11a5.5 5.5 0 000-11z" fill="currentColor"/></svg></button>
  <button class="ib" id="keysBtn" title="Keyboard shortcuts · ?"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="1.75" y="4" width="12.5" height="8" rx="1.5"/><path d="M4.5 7h.01M7 7h.01M9.5 7h.01M12 7h.01M5 9.5h6"/></svg></button>
</div>

<div class="chrome">
  <div class="toolbar">
    <label class="field" id="field" hidden><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14" stroke-linecap="round"/></svg><input id="filter" placeholder="Search groups and sounds" autocomplete="off" spellcheck="false"><button class="x" id="clear" aria-label="Clear"><svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></label>
    <span class="count" id="count"></span>
    <div class="tally" id="tally"></div>
    <span class="sp"></span>
    <button class="switch on" id="match" title="Play every sound at the same loudness · M">Match loudness<i></i></button>
  </div>
  <div class="transport">
    <button class="play" id="play" aria-label="Play"><svg viewBox="0 0 16 16"><path id="playicon" d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg></button>
    <span class="level"><i id="level"></i></span>
    <span class="clock" id="clock">0:00.0 / 0:00.0</span>
    <div class="track" id="track"><i id="bar"></i><b id="knob"></b></div>

// Theme: auto → light → dark
const themes = ['auto', 'light', 'dark'];

const P = { g: null, active: 0, playing: false, at: 0, started: 0, nodes: [], once: false };
const len = g => Math.max(0.001, ...g.members.map(m => m.secs || 0));

function toggle() { if (P.g == null) { P.g = firstVisible(); changed(); } P.playing ? pause() : start(P.g, P.at >= len(D.groups[P.g]) - 0.01 ? 0 : P.at, false); }

// Drag along a strip or the transport to move the playhead silently; it resumes on release.
function scrubber(el, gi, span, frac) {

// A waveform the way adeck draws one: a blue envelope with a light core, the playhead in white.

const canvas = (gi, mi, own) => { const c = h('canvas', 'wave'); c.dataset.g = gi; c.dataset.m = mi; if (own) c.dataset.own = '1'; return c; };

// Build the tab
const groupEls = [];
const body = $('#body');
if (KIND === 'compare') {
  const g = D.groups[0], gi = 0, L = len(g), wrap = h('div', 'cmp');
  wrap.append(ruler(L));

    const row = h('div', 'strip'); row.dataset.g = gi; row.dataset.m = mi;

    t.append(nm);

} else {
  D.groups.forEach((g, gi) => {
    const el = h('section', 'card'); el.id = `g${gi}`; el.dataset.g = gi;

const firstVisible = () => Math.max(0, groupEls.findIndex(el => !el.classList.contains('hidden')));

// The sheet: the group in focus, the sound you're hearing, big, with everything known about it.
function sheet() {
  const el = $('#sheet'); if (el.hidden) return;
  const gi = P.g ?? firstVisible(), g = D.groups[gi], mi = P.g == null ? 0 : P.active, m = g.members[mi];
  el.innerHTML = '';
  const hd = h('div'); hd.style.cssText = 'display:flex;align-items:flex-start;gap:8px';
  const t = h('div'); t.style.cssText = 'flex:1;min-width:0'; t.append(h('h3', null, g.title || D.title), h('div', 'who', [g.subtitle, plural(g.members.length, 'sound')].filter(Boolean).join(' · ')));
  const x = h('button', 'ib close'); x.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>'; x.addEventListener('click', () => el.classList.remove('open'));
  hd.append(t, x); el.append(hd);

  const ck = h('span', 'tnum', fmt(P.g === gi ? now() : 0)); ck.id = 'sheetClock'; hr.append(ck);
  if (matchOn && m.lufs != null) hr.append(h('span', 'tnum', `matched ${(20 * Math.log10(trim(m))).toFixed(1)} dB`));
  hr.append(h('span', 'sp'));

  el.append(hr);

  const facts = [];

  if (m.lufs != null) facts.push(['loudness', `${m.lufs.toFixed(1)} LUFS`]);
  Object.entries(m.numbers || {}).forEach(([k, v]) => facts.push([(D.labels || {})[k] || k, typeof v === 'number' ? +v.toFixed(3) : v]));

  kv('What made it', Object.entries(m.meta || {}));

$('#sheetBtn').addEventListener('click', () => $('#sheet').classList.toggle('open'));

function changed() {

  $$('.diff [data-m]').forEach(c => c.classList.toggle('on', P.active === +c.dataset.m));
  sheet();
  draw();
}
const lvl = new Uint8Array(512);
function draw() {
  $('#playicon').setAttribute('d', P.playing ? 'M4 2.5h3v11H4zM9 2.5h3v11H9z' : 'M4 2.5v11l9-5.5z');

}

})();
scrubber($('#track'), () => P.g ?? firstVisible(), () => { const g = D.groups[P.g ?? firstVisible()], m = g.members[P.active]; return P.once && m ? (m.secs || 1) : len(g); });

// The toolbar's search narrows the board as you type, like adeck's.
function filter() {
  const q = $('#filter').value.trim().toLowerCase();
  $('#field').classList.toggle('has', !!q);
  let shown = 0;
  D.groups.forEach((g, gi) => {
    const hay = [g.title, g.subtitle, g.chip && g.chip.text, ...g.members.flatMap(m => [m.label, m.role, ...Object.values(m.meta || {})])].filter(Boolean).join(' ').toLowerCase();
    const ok = !q || hay.includes(q);
    groupEls[gi].classList.toggle('hidden', !ok); if (ok) shown++;
  });
  $('#empty').hidden = shown > 0; $('#empty').textContent = `No group or sound matches “${$('#filter').value.trim()}”.`;
}
if (KIND !== 'compare') {
  $('#filter').addEventListener('input', filter);
  $('#filter').addEventListener('keydown', e => { if (e.key === 'Escape') { $('#filter').value = ''; filter(); $('#filter').blur(); } });
  $('#clear').addEventListener('click', e => { e.preventDefault(); $('#filter').value = ''; filter(); });
}

// ⌘K: jump to any group or sound and play it.
const items = [];
D.groups.forEach((g, gi) => {
  if (KIND !== 'compare') items.push({ sec: 'Groups', title: g.title || D.title, sub: [g.subtitle, g.chip && g.chip.text].filter(Boolean).join(' · '), gi, mi: null });
  g.members.forEach((m, mi) => items.push({ sec: 'Sounds', title: m.label, sub: [KIND !== 'compare' && g.title, m.role, Object.values(m.meta || {}).slice(0, 2).join(' ')].filter(Boolean).join(' · '), gi, mi }));
});
const score = (q, s) => { s = s.toLowerCase(); const i = s.indexOf(q); if (i >= 0) return 100 - i + ((i === 0 || /\W/.test(s[i - 1])) ? 20 : 0); let at = 0, sc = 0; for (const c of q) { const j = s.indexOf(c, at); if (j < 0) return -1; sc += (j === 0 || /\W/.test(s[j - 1])) ? 8 : (j === at ? 3 : -2); at = j + 1; } return sc > q.length * 2 ? sc : -1; };
let hits = [], active = 0;
function renderPalette() {
  const q = $('#pq').value.trim().toLowerCase();
  hits = q ? items.map(it => [Math.max(score(q, it.title) + 10, score(q, `${it.title} ${it.sub}`)), it]).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]).map(x => x[1]) : items.slice(0, 60);
  const order = [...new Set(hits.map(x => x.sec))];
  hits.sort((a, b) => order.indexOf(a.sec) - order.indexOf(b.sec));
  active = Math.min(active, Math.max(0, hits.length - 1));
  const list = $('#plist'); list.innerHTML = '';
  let sec = '';
  hits.forEach((it, i) => {
    if (it.sec !== sec) { sec = it.sec; list.append(h('div', 'sec', sec)); }
    const r = h('div', `hit${i === active ? ' on' : ''}`); r.innerHTML = it.mi == null ? GRID_SVG : PLAY_SVG; r.append(h('b', null, it.title), h('span', null, it.sub));
    r.addEventListener('mousemove', () => { if (active !== i) { active = i; renderPalette(); } });
    r.addEventListener('click', () => choose(it));
    list.append(r);
  });
  if (!hits.length) list.append(h('div', 'none', `Nothing matches “${$('#pq').value}”`));
  $('#pcount').textContent = plural(hits.length, 'result');
  const on = $('.hit.on', list); if (on) on.scrollIntoView({ block: 'nearest' });
}
function choose(it) {
  closeAll();
  if (KIND !== 'compare') groupEls[it.gi].scrollIntoView({ block: 'start', behavior: 'smooth' });
  if (it.mi == null) focus(it.gi); else select(it.gi, it.mi, KIND === 'pads', true);
}
const openPalette = () => { $('#keys').classList.remove('open'); $('#palette').classList.add('open'); $('#pq').value = ''; active = 0; renderPalette(); setTimeout(() => $('#pq').focus(), 0); };
const closeAll = () => { $$('.scrim').forEach(s => s.classList.remove('open')); $('#pq').blur(); };
$('#openPalette').addEventListener('click', openPalette);
$('#keysBtn').addEventListener('click', () => $('#keys').classList.toggle('open'));
$$('.scrim').forEach(s => s.addEventListener('pointerdown', e => { if (e.target === s) closeAll(); }));
$('#pq').addEventListener('input', () => { active = 0; renderPalette(); });
$('#pq').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (hits.length) { active = (active + (e.key === 'ArrowDown' ? 1 : hits.length - 1)) % hits.length; renderPalette(); } }
  else if (e.key === 'Enter') { e.preventDefault(); if (hits[active]) choose(hits[active]); }
  else if (e.key === 'Escape') closeAll();
});

// The keys sheet, this tab's keys first.
const K = {
  board: ['Board', [['Previous or next group', '↑ ↓'], ['Previous or next sound', '← →'], ['Seek five seconds', '⇧← ⇧→'], ['Play a sound', '1–9'], ['Replay from the start', 'R']]],
  pads: ['Pads', [['Play a pad from the top', '1–9'], ['Replay the last pad', 'R'], ['Previous or next group', '↑ ↓']]],
  compare: ['Compare', [['Switch to a file', '1–9'], ['Step a second (⇧ five)', '← →'], ['Replay from the start', 'R']]],
  all: ['Everywhere', [['Play or pause', 'Space'], ['Match loudness', 'M'], ['Search', '⌘K /'], ['This sheet', '?'], ['Close', 'Esc']]],
};
[K[KIND], K.all].forEach(([title, rows], i) => {
  const s = h('div'), hd = h('h4', null, title);
  if (i === 0) hd.append(h('em', null, 'this tab'));
  s.append(hd);
  rows.forEach(([what, keys]) => { const r = h('div', 'k'), caps = h('span', 'caps'); keys.split(' ').forEach(k => caps.append(h('span', 'kc', k))); r.append(h('span', null, what), caps); s.append(r); });
  $('#keysGrid').append(s);
});

$('#play').addEventListener('click', toggle);
$('#match').addEventListener('click', () => setMatch(!matchOn));
$('#vol').addEventListener('input', e => { if (master) master.gain.value = +e.target.value; });
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#palette').classList.contains('open') ? closeAll() : openPalette(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea/i.test(e.target.tagName)) return;
  if (e.key === 'Escape') { closeAll(); $('#sheet').classList.remove('open'); return; }
  const g = P.g ?? firstVisible(), G = D.groups[g];
  if (e.key === '/') { e.preventDefault(); if (KIND !== 'compare') $('#filter').focus(); else openPalette(); }
  else if (e.key === '?') $('#keys').classList.toggle('open');
  else if (e.key === ' ') { e.preventDefault(); toggle(); }
  else if (e.key === 'm' || e.key === 'M') setMatch(!matchOn);
  else if (e.key === 'r' || e.key === 'R') select(g, P.g == null ? 0 : P.active, true);
  else if (/^[1-9]$/.test(e.key)) { const i = +e.key - 1; if (i < G.members.length) select(g, i, KIND === 'pads', true); }
  else if (KIND !== 'compare' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault();
    const vis = groupEls.map((el, i) => el.classList.contains('hidden') ? -1 : i).filter(i => i >= 0);
    const at = vis.indexOf(P.g ?? -1), next = vis[Math.max(0, Math.min(vis.length - 1, at + (e.key === 'ArrowDown' ? 1 : -1)))];
    if (next != null) { focus(next); groupEls[next].scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault();
    const d = e.key === 'ArrowLeft' ? -1 : 1;
    if (KIND === 'board' && !e.shiftKey) { const n = G.members.length; select(g, ((P.g == null ? -1 : P.active) + d + n) % n, false, true); }
    else seek(g, now() + d * (e.shiftKey ? 5 : KIND === 'compare' ? 1 : 2));
  }
});
window.addEventListener('resize', draw);
changed();
applyTheme();
})();
</script>
</body>
