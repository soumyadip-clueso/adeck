<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  --page: #0e0f11; --layer: #16181b; --layer2: #1d2024; --line: #2a2e33; --line2: #3a3f46;
  --text: #eceef0; --muted: #9aa1a9; --faint: #6b727a; --accent: #5b8cff; --accent2: #ff8a4c;
  --good: #3ecf8e; --close: #e8b931; --bad: #ff6b6b; --wave: #7f9cc9; --wave-on: #b9cdf5;
  --radius: 12px;
}
@media (prefers-color-scheme: light) {
  :root { --page: #f6f7f9; --layer: #ffffff; --layer2: #f0f2f5; --line: #e2e5ea; --line2: #cfd4db;
    --text: #15181c; --muted: #5d6570; --faint: #8a929c; --wave: #8fa6cc; --wave-on: #2f5fd0; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
#fx { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; opacity: .3; transition: opacity .6s; }
#fx.off { opacity: 0; }
.wrap { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 32px 16px 80px; }
header h1 { font-size: 26px; letter-spacing: -0.01em; margin: 0 0 4px; }
header .sub { color: var(--muted); font-size: 13px; }
.note { margin: 18px 0 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--layer); color: var(--text); }
.bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 22px -16px 0; padding: 10px 16px; background: color-mix(in srgb, var(--page) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar .sp { flex: 1; }
.btn { appearance: none; border: 1px solid var(--line2); background: transparent; color: var(--text); font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 8px; cursor: pointer; transition: background .15s, border-color .15s, transform .08s; }
.btn:hover { background: var(--layer2); }
.btn:active { transform: scale(.97); }
.btn.on { background: var(--text); color: var(--page); border-color: var(--text); }
.play { width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; padding: 0; background: var(--text); color: var(--page); border: 0; }
.play svg { width: 14px; height: 14px; }
.clock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; min-width: 96px; }
.keys { color: var(--faint); font-size: 12px; }
input[type=range] { accent-color: var(--accent); width: 110px; }
.group { margin-top: 26px; border: 1px solid var(--line); border-radius: 16px; background: color-mix(in srgb, var(--layer) 86%, transparent); padding: 16px; transition: border-color .2s, box-shadow .2s; }
.group.focus { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent); }
.ghead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.ghead h2 { margin: 0; font-size: 17px; }
.ghead .sub { color: var(--faint); font-size: 12.5px; }
.ghead .sp { flex: 1; }
.chip { font-size: 11.5px; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
.chip.good { color: var(--good); } .chip.close { color: var(--close); } .chip.bad { color: var(--bad); } .chip.neutral { color: var(--muted); }
.row { display: grid; grid-template-columns: 220px 1fr; gap: 12px; align-items: stretch; margin-top: 8px; }
.who { display: flex; gap: 10px; align-items: flex-start; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; transition: background .15s, border-color .15s; min-width: 0; }
.who:hover { background: var(--layer2); }
.row.on .who { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.kbd { font-size: 11px; color: var(--faint); border: 1px solid var(--line2); border-radius: 4px; padding: 0 5px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.who .t { min-width: 0; flex: 1; }
.who .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who .nums { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.role { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.role.pick { color: var(--accent); } .role.ref { color: var(--accent2); } .role.before { color: var(--faint); }
canvas.wave { width: 100%; height: 64px; display: block; border-radius: 10px; background: var(--layer2); cursor: pointer; touch-action: none; }
.local { display: grid; place-items: center; height: 64px; border: 1px dashed var(--line2); border-radius: 10px; color: var(--faint); font-size: 12.5px; }
details.meta { grid-column: 2; margin-top: -2px; }
details.meta summary { color: var(--faint); font-size: 12px; cursor: pointer; list-style: none; }
details.meta summary::before { content: "▸ "; } details.meta[open] summary::before { content: "▾ "; }
details.meta dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 6px 0 0; font-size: 12.5px; }
details.meta dt { color: var(--faint); } details.meta dd { margin: 0; word-break: break-word; }
.pads { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.pad { position: relative; overflow: hidden; text-align: left; border: 1px solid var(--line); border-radius: 12px; background: var(--layer2); color: var(--text); font: inherit; padding: 11px 12px 14px; min-height: 104px; cursor: pointer; transition: transform .1s, background .15s, border-color .15s; }
.pad:hover { border-color: var(--line2); }
.pad:active { transform: scale(.98); }
.pad.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--layer2)); }
.pad .name { font-size: 16px; font-weight: 600; margin: 6px 0 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pad .nums { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.pad .fill { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--accent); }
.pad[disabled] { cursor: default; opacity: .6; }
footer { margin-top: 40px; color: var(--faint); font-size: 12px; text-align: center; }
@media (max-width: 640px) {
  .row { grid-template-columns: 1fr; gap: 6px; }
  details.meta { grid-column: 1; }
  .keys { display: none; }
}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div class="sub" id="sub"></div>
    <div class="note" id="note" hidden></div>
  </header>
  <div class="bar">
    <button class="play" id="play" aria-label="Play"><svg viewBox="0 0 16 16"><path id="playicon" d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg></button>
    <span class="clock" id="clock">0:00.0</span>
    <span class="keys">Space play · 1–9 switch · ↑↓ group</span>
    <span class="sp"></span>
    <button class="btn" id="ripples" title="Ripples behind the page, driven by what's playing">Ripples</button>
    <button class="btn on" id="match" title="Play every sound at the same loudness">Match loudness</button>
    <label class="keys" style="display:flex;gap:6px;align-items:center">Volume <input type="range" id="vol" min="0" max="1" step="0.01" value="0.9"></label>
  </div>
  <main id="groups"></main>
  <footer>Shared from adeck. Reference-pack sounds stay on the sharer's machine.</footer>
</div>
<script id="data" type="application/json">/*__DATA__*/null</script>
<script>/*__RIPPLES__*/</script>
<script>
(() => {
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (s, el = document) => el.querySelector(s);
const h = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const fmt = s => { s = Math.max(0, s || 0); const m = Math.floor(s / 60); return `${m}:${(s - m * 60).toFixed(1).padStart(4, '0')}`; };
const TARGET = -16;
document.title = D.title;
$('#title').textContent = D.title;
const n = D.groups.reduce((a, g) => a + g.members.length, 0);
$('#sub').textContent = `${n} sound${n === 1 ? '' : 's'}${D.groups.length > 1 ? ` in ${D.groups.length} groups` : ''} · ${new Date(D.created * 1000).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}`;
if (D.note) { const el = $('#note'); el.hidden = false; el.innerHTML = D.note.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }

let ctx = null, master = null, matchOn = true;
let analyser = null, wave = null;
const audio = () => { if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = +$('#vol').value; master.connect(ctx.destination); analyser = ctx.createAnalyser(); analyser.fftSize = 1024; wave = new Float32Array(analyser.fftSize); master.connect(analyser); } return ctx; };

// Ripples: the page is a ripple tank; what plays drops rings from where it sits on screen.
const fxCanvas = $('#fx');
let fx = null;
const store = { get: k => { try { return localStorage.getItem(k); } catch (_) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} } };
const fxColors = () => { const light = matchMedia('(prefers-color-scheme: light)').matches; fx && fx.colors(light ? [0.42, 0.48, 0.58] : [1, 1, 1], light ? [0.965, 0.969, 0.976] : [0.055, 0.059, 0.067]); };
function setRipples(on) {
  $('#ripples').classList.toggle('on', on); fxCanvas.classList.toggle('off', !on); store.set('adeck-ripples', on ? '1' : '0');
  if (on && !fx && window.Ripples) { fx = Ripples(fxCanvas, { ambient: true, gain: 6 }); if (fx) { fxColors(); fx.drop(0.12, 0.3, 1.4, 2.6); fx.drop(0.9, 0.72, 1.2, 2.4); fx.drop(0.82, 0.18, 0.9, 2.2); fx.advance(200); } }
  if (fx) fx.pause(!on);
}
matchMedia('(prefers-color-scheme: light)').addEventListener('change', fxColors);
function fxDrive() {
  if (!fx || !analyser || fxCanvas.classList.contains('off')) return;
  fx.set('ambient', !P.playing);
  if (!P.playing) return;
  analyser.getFloatTimeDomainData(wave);
  let sum = 0; for (let i = 0; i < wave.length; i++) sum += wave[i] * wave[i];
  const el = document.querySelector('.row.on .who, .pad.on');
  const r = el ? el.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0, height: 0 };
  fx.drive(Math.min(1, Math.sqrt(sum / wave.length) * 3), (r.left + r.width / 2) / innerWidth, (r.top + r.height / 2) / innerHeight);
}
const buffers = new Map();
const load = src => { if (!buffers.has(src)) buffers.set(src, fetch(src).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }).then(b => audio().decodeAudioData(b))); return buffers.get(src); };
const trim = m => matchOn && m.lufs != null ? Math.min(4, Math.pow(10, (TARGET - m.lufs) / 20)) : 1;

// One group plays at a time; every member of it runs in step and only the gains move.
const P = { g: null, active: 0, playing: false, at: 0, started: 0, nodes: [], once: false };
const groupEls = [];
const len = g => Math.max(0.001, ...g.members.map(m => m.secs || 0));
const now = () => P.playing ? P.at + (ctx.currentTime - P.started) : P.at;
function stopNodes() { P.nodes.forEach(x => { try { x.src.stop(); } catch (_) {} }); P.nodes = []; }
async function start(g, at, once) {
  audio(); if (ctx.state === 'suspended') await ctx.resume();
  stopNodes();
  const ms = D.groups[g].members;
  const bufs = await Promise.all(ms.map(m => m.src ? load(m.src).catch(() => null) : null));
  if (P.g !== g) return;
  const t0 = ctx.currentTime + 0.03;
  P.nodes = ms.map((m, i) => {
    if (!bufs[i] || (once && i !== P.active)) return null;
    const src = ctx.createBufferSource(); src.buffer = bufs[i];
    const gain = ctx.createGain(); gain.gain.value = i === P.active ? trim(m) : 0;
    src.connect(gain).connect(master);
    if (at < bufs[i].duration) src.start(t0, at);
    return { src, gain, i };
  }).filter(Boolean);
  P.at = at; P.started = t0; P.playing = true; P.once = once;
  draw();
}
function pause() { if (!P.playing) return; P.at = now(); P.playing = false; stopNodes(); draw(); }
function focus(g) { if (P.g === g) return; pause(); P.g = g; P.at = 0; P.active = 0; draw(); }
function select(g, i, fromTop) {
  const pads = D.groups[g].layout === 'pads';
  if (P.g !== g) { pause(); P.g = g; P.at = 0; }
  P.active = i;
  if (pads || fromTop) { start(g, 0, pads); return; }
  if (P.playing) P.nodes.forEach(x => x.gain.gain.setTargetAtTime(x.i === i ? trim(D.groups[g].members[x.i]) : 0, ctx.currentTime, 0.004));
  draw();
}
function toggle() { if (P.g == null) P.g = 0; P.playing ? pause() : start(P.g, P.at >= len(D.groups[P.g]) - 0.01 ? 0 : P.at, false); }
function seek(g, at, silent) { const was = P.playing && P.g === g; if (P.g !== g) focus(g); pause(); P.at = Math.max(0, Math.min(at, len(D.groups[g]))); if (was && !silent) start(g, P.at, false); draw(); }

function waveCanvas(m, gi, mi) {
  const c = h('canvas', 'wave'); c.dataset.g = gi; c.dataset.m = mi;
  let resume = false;
  const at = e => { const r = c.getBoundingClientRect(); return (e.clientX - r.left) / r.width * len(D.groups[gi]); };
  c.addEventListener('pointerdown', e => { c.setPointerCapture(e.pointerId); resume = P.playing && P.g === gi; if (P.active !== mi || P.g !== gi) { focus(gi); P.active = mi; } seek(gi, at(e), true); });
  c.addEventListener('pointermove', e => { if (c.hasPointerCapture(e.pointerId)) seek(gi, at(e), true); });
  c.addEventListener('pointerup', e => { seek(gi, at(e), true); if (resume) start(gi, P.at, false); });
  return c;
}
function paintWave(c) {
  const gi = +c.dataset.g, mi = +c.dataset.m, g = D.groups[gi], m = g.members[mi];
  const dpr = window.devicePixelRatio || 1, w = c.clientWidth, hh = c.clientHeight;
  if (c.width !== w * dpr) { c.width = w * dpr; c.height = hh * dpr; }
  const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, hh);
  const css = getComputedStyle(document.documentElement);
  const on = P.g === gi && P.active === mi;
  const frac = (m.secs || 0) / len(g), pk = m.peaks || [], mid = hh / 2, ww = w * frac;
  const top = Math.max(0.05, ...pk);
  const ph = P.g === gi ? now() / len(g) * w : -1;
  for (let i = 0; i < pk.length; i++) {
    const px = i / pk.length * ww, a = Math.max(0.6, pk[i] / top * (hh / 2 - 6));
    x.fillStyle = px < ph && on ? css.getPropertyValue('--wave-on') : css.getPropertyValue('--wave');
    x.globalAlpha = on ? 1 : 0.7;
    x.fillRect(px, mid - a, Math.max(1, ww / pk.length - 0.4), a * 2);
  }
  x.globalAlpha = 1;
  if (ph >= 0) { x.fillStyle = css.getPropertyValue('--text'); x.fillRect(ph, 0, 1.5, hh); }
}
function nums(m) { return Object.entries(m.numbers || {}).map(([k, v]) => `${(D.labels || {})[k] || k} ${typeof v === 'number' ? +v.toFixed(3) : v}`).join(' · ') || (m.lufs != null ? `${m.lufs.toFixed(1)} LUFS` : ''); }

D.groups.forEach((g, gi) => {
  const el = h('section', 'group'); el.addEventListener('pointerdown', () => focus(gi));
  const head = h('div', 'ghead'); head.append(h('h2', null, g.title || D.title));
  if (g.subtitle) head.append(h('span', 'sub', g.subtitle));
  head.append(h('span', 'sp'));
  if (g.chip) head.append(h('span', `chip ${g.chip.tone || 'neutral'}`, g.chip.text));
  el.append(head);
  if (g.layout === 'pads') {
    const grid = h('div', 'pads');
    g.members.forEach((m, mi) => {
      const b = h('button', 'pad'); b.dataset.g = gi; b.dataset.m = mi; b.disabled = !m.src;
      const top = h('div'); top.append(h('span', 'kbd', mi < 9 ? String(mi + 1) : ''), document.createTextNode(' '), h('span', `role ${m.role || ''}`, m.src ? (m.role || '') : 'local only'));
      b.append(top, h('div', 'name', m.label), h('div', 'nums', nums(m)), h('div', 'fill'));
      b.addEventListener('click', () => select(gi, mi, true));
      grid.append(b);
    });
    el.append(grid);
  } else {
    g.members.forEach((m, mi) => {
      const row = h('div', 'row'); row.dataset.g = gi; row.dataset.m = mi;
      const who = h('div', 'who'); who.append(h('span', 'kbd', mi < 9 ? String(mi + 1) : ''));
      const t = h('div', 't'); t.append(h('div', `role ${m.role || ''}`, m.role || ''), h('div', 'name', m.label), h('div', 'nums', nums(m)));
      who.append(t); who.addEventListener('click', () => select(gi, mi, false));
      row.append(who, m.src ? waveCanvas(m, gi, mi) : h('div', 'local', 'Reference: plays only on the sharer’s machine'));
      const meta = Object.entries(m.meta || {});
      if (meta.length) { const d = h('details', 'meta'); d.append(h('summary', null, 'Details')); const dl = h('dl'); meta.forEach(([k, v]) => dl.append(h('dt', null, k), h('dd', null, v))); d.append(dl); row.append(h('div'), d); }
      el.append(row);
    });
  }
  groupEls.push(el); $('#groups').append(el);
});

function draw() {
  groupEls.forEach((el, gi) => el.classList.toggle('focus', P.g === gi && D.groups.length > 1));
  document.querySelectorAll('.row, .pad').forEach(r => r.classList.toggle('on', P.g === +r.dataset.g && P.active === +r.dataset.m));
  $('#playicon').setAttribute('d', P.playing ? 'M4 2.5h3v11H4zM9 2.5h3v11H9z' : 'M4 2.5v11l9-5.5z');
  $('#clock').textContent = P.g == null ? '0:00.0' : `${fmt(now())} / ${fmt(len(D.groups[P.g]))}`;
  document.querySelectorAll('canvas.wave').forEach(paintWave);
  document.querySelectorAll('.pad').forEach(p => { const on = P.playing && P.g === +p.dataset.g && P.active === +p.dataset.m; const m = D.groups[+p.dataset.g].members[+p.dataset.m]; $('.fill', p).style.width = on ? `${Math.min(100, now() / (m.secs || 1) * 100)}%` : '0'; });
}
(function tick() {
  fxDrive();
  if (P.playing) { const end = P.once ? (D.groups[P.g].members[P.active].secs || 0) : len(D.groups[P.g]); if (now() >= end) { P.playing = false; P.at = P.once ? 0 : end; stopNodes(); } draw(); }
  requestAnimationFrame(tick);
})();
window.addEventListener('resize', draw);
$('#play').addEventListener('click', toggle);
$('#match').addEventListener('click', e => { matchOn = !matchOn; e.currentTarget.classList.toggle('on', matchOn); if (P.playing) P.nodes.forEach(x => x.gain.gain.setTargetAtTime(x.i === P.active ? trim(D.groups[P.g].members[x.i]) : 0, ctx.currentTime, 0.004)); });
$('#ripples').addEventListener('click', () => setRipples(!$('#ripples').classList.contains('on')));
setRipples(store.get('adeck-ripples') !== '0' && !matchMedia('(prefers-reduced-motion: reduce)').matches);
$('#vol').addEventListener('input', e => { if (master) master.gain.value = +e.target.value; });
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea/i.test(e.target.tagName)) return;
  if (e.key === ' ') { e.preventDefault(); toggle(); }
  else if (/^[1-9]$/.test(e.key)) { const g = P.g ?? 0, i = +e.key - 1; if (i < D.groups[g].members.length) select(g, i, false); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const g = Math.max(0, Math.min(D.groups.length - 1, (P.g ?? -1) + (e.key === 'ArrowDown' ? 1 : -1))); focus(g); groupEls[g].scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { if (P.g != null) seek(P.g, now() + (e.key === 'ArrowLeft' ? -2 : 2)); }
});
draw();
})();
</script>
</body>
</html>
